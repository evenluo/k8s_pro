# 基础课程元数据
course:
  id: "00-foundation"
  name: "容器与 Docker 入门"
  level: "beginner"
  duration: "3 hours"
  language: "zh-CN"
  version: "1.0.0"

objectives:
  - "搭建 Kubernetes 学习环境"
  - "理解容器技术核心概念"
  - "掌握 Docker 基本操作"
  - "为 Kubernetes 学习打基础"

modules:
  - id: "01"
    name: "环境搭建"
    path: "01-环境搭建"
    duration: "30min"
    topics:
      - "macOS 环境配置"
      - "Docker Desktop 安装"
      - "工具链配置"
      - "环境验证"

  - id: "02"
    name: "容器基础"
    path: "02-容器基础"
    duration: "45min"
    topics:
      - "容器 vs 虚拟机"
      - "Linux 容器技术"
      - "资源隔离机制"
      - "容器生态系统"

  - id: "03"
    name: "Docker入门"
    path: "03-Docker入门"
    duration: "60min"
    topics:
      - "Docker 架构"
      - "镜像管理"
      - "容器操作"
      - "网络与存储"

labs:
  - name: "docker-basics"
    file: "labs/docker-basics.yaml"
    difficulty: "easy"
    duration: "30min"

  - name: "container-networking"
    file: "labs/container-networking.yaml"
    difficulty: "medium"
    duration: "30min"

  - name: "data-persistence"
    file: "labs/data-persistence.yaml"
    difficulty: "medium"
    duration: "30min"

assessment:
  quiz:
    file: "assessment/quiz.json"
    questions: 20
    passing_score: 80
    time_limit: "30min"

  practical:
    file: "assessment/practical-tasks.md"
    tasks: 3
    required: 1

  troubleshooting:
    file: "assessment/troubleshooting.md"
    scenarios: 3
    required: 1

prerequisites:
  hardware:
    - "macOS 11.0+ 或 Linux"
    - "8GB RAM (推荐 16GB)"
    - "20GB 可用磁盘空间"

  software:
    - "Homebrew (macOS)"
    - "基本终端使用经验"

  knowledge:
    - "基本 Linux 命令"
    - "文件系统概念"

next_course: "01-core"

resources:
  documentation:
    - name: "Docker 官方文档"
      url: "https://docs.docker.com/"
      type: "official"

    - name: "Docker Hub"
      url: "https://hub.docker.com/"
      type: "registry"

  videos:
    - name: "容器技术介绍"
      duration: "15min"
      language: "zh-CN"

  references:
    - name: "Docker 最佳实践"
      url: "https://docs.docker.com/develop/dev-best-practices/"
      type: "guide"

tags:
  - "docker"
  - "container"
  - "beginner"
  - "foundation"
  - "environment-setup"

metadata:
  created_at: "2024-01-01"
  updated_at: "2024-01-01"
  author: "K8s Learning Project"
  maintainer: "learning-team"
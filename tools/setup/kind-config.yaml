# Kind 集群配置文件
# 用于创建一个资源优化的 3 节点 Kubernetes 学习集群
# 使用方式: kind create cluster --name learn-k8s --config tools/setup/kind-config.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# 集群名称将通过命令行参数指定: --name learn-k8s
# 这个配置文件定义集群的结构和资源限制

# 网络配置
networking:
  # API Server 监听地址
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443

  # Pod 网络 CIDR (不与 Docker 网络冲突)
  podSubnet: "10.244.0.0/16"

  # Service 网络 CIDR
  serviceSubnet: "10.96.0.0/12"

  # 禁用默认 CNI，使用 Kind 自带的 kindnet
  disableDefaultCNI: false

  # DNS 域名
  kubeProxyMode: "ipvs"

# 节点配置 - 3 节点集群 (1 控制平面 + 2 工作节点)
nodes:
  # 控制平面节点 (Master)
  - role: control-plane
    # 镜像版本 - 使用稳定的 Kubernetes 版本
    image: kindest/node:v1.29.0

    # 端口映射 - 暴露常用端口到主机
    extraPortMappings:
      # NodePort 服务端口范围 (30000-30010)
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP

      # HTTP 端口 (用于 Ingress)
      - containerPort: 80
        hostPort: 80
        protocol: TCP

      # HTTPS 端口 (用于 Ingress)
      - containerPort: 443
        hostPort: 443
        protocol: TCP

    # 挂载额外的主机路径
    extraMounts:
      # 挂载项目目录 (可选，用于开发)
      - hostPath: ./courses
        containerPath: /courses
        readOnly: true

    # Kubelet 配置
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            # 资源预留 - 为系统预留资源
            system-reserved: "cpu=100m,memory=200Mi"
            kube-reserved: "cpu=100m,memory=200Mi"
            eviction-hard: "memory.available<200Mi,nodefs.available<10%"
            # 最大 Pod 数量限制
            max-pods: "110"
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            # 启用审计日志 (可选)
            audit-log-maxage: "30"
            audit-log-maxbackup: "3"
            audit-log-maxsize: "100"
        controllerManager:
          extraArgs:
            # 资源配额
            bind-address: "0.0.0.0"
        scheduler:
          extraArgs:
            bind-address: "0.0.0.0"
      - |
        kind: KubeletConfiguration
        # 容器日志
        containerLogMaxSize: "10Mi"
        containerLogMaxFiles: 3
        # 镜像 GC
        imageGCHighThresholdPercent: 85
        imageGCLowThresholdPercent: 80

    # 节点标签
    labels:
      node-type: "control-plane"
      environment: "learning"

  # 工作节点 1
  - role: worker
    image: kindest/node:v1.29.0

    # Kubelet 配置
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            # 资源预留
            system-reserved: "cpu=100m,memory=200Mi"
            kube-reserved: "cpu=100m,memory=200Mi"
            eviction-hard: "memory.available<200Mi,nodefs.available<10%"
            # Pod 限制
            max-pods: "110"
      - |
        kind: KubeletConfiguration
        containerLogMaxSize: "10Mi"
        containerLogMaxFiles: 3
        imageGCHighThresholdPercent: 85
        imageGCLowThresholdPercent: 80

    # 节点标签
    labels:
      node-type: "worker"
      node-role: "application"
      environment: "learning"

  # 工作节点 2
  - role: worker
    image: kindest/node:v1.29.0

    # Kubelet 配置
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            # 资源预留
            system-reserved: "cpu=100m,memory=200Mi"
            kube-reserved: "cpu=100m,memory=200Mi"
            eviction-hard: "memory.available<200Mi,nodefs.available<10%"
            # Pod 限制
            max-pods: "110"
      - |
        kind: KubeletConfiguration
        containerLogMaxSize: "10Mi"
        containerLogMaxFiles: 3
        imageGCHighThresholdPercent: 85
        imageGCLowThresholdPercent: 80

    # 节点标签
    labels:
      node-type: "worker"
      node-role: "application"
      environment: "learning"

# 功能门控
featureGates:
  # 启用临时容器 (用于调试)
  "EphemeralContainers": true
  # 启用 API 优先级和公平性
  "APIPriorityAndFairness": true

# containerd 配置
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
      endpoint = ["https://registry-1.docker.io"]
    [plugins."io.containerd.grpc.v1.cri".containerd]
      # 限制并发下载
      max_concurrent_downloads = 3
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
      # 运行时配置
      runtime_type = "io.containerd.runc.v2"
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
      # 启用 systemd cgroup
      SystemdCgroup = true